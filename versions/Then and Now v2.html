/* Then and Now: The Journey's working-practice look, carried into six palettes,
   each with a light and a dark version. Type: Newsreader (reading serif) and
   Atkinson Hyperlegible (labels), embedded so it renders the same everywhere. */

:root{
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px; --maxw:1180px; --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 1px 2px rgba(24,40,56,.05),0 8px 24px rgba(24,40,56,.06);
  /* Journey, light (default) */
  --page:#F6F4EF; --glass:rgba(246,244,239,.92); --card:#FFFFFF; --card-2:#FAF9F5;
  --line:#E0DED6; --line-2:#CFCBC0; --text:#243440; --muted:#55636F; --faint:#5F6B76;
  --head:#16334E; --pri:#16334E; --on-pri:#FFFFFF; --sec:#0D555A; --on-sec:#FFFFFF;
  --acc:#7E611F; --ok:#3D5629; --ok-soft:#E7F0E2; --warn:#87403D; --warn-soft:#F8EAE8;
  --tint:#E9F1F7; --focus:#B0873A; --track:#ECEAE3; --scrim:rgba(24,40,56,.42);
  --field:color-mix(in srgb, var(--muted) 84%, var(--card));
  color-scheme:light;
}

html[data-size="xl"]{ font-size:19px; }

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; }
html{ font-size:16px; -webkit-text-size-adjust:100%; }
body{ background:var(--page); color:var(--text); font-family:var(--serif);
  font-size:1.0625rem; line-height:1.58; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; }
img,svg{ max-width:100%; }
a{ color:var(--sec); text-underline-offset:.16em; }
button,input,textarea,select{ font:inherit; color:inherit; }
:focus-visible{ outline:2.5px solid var(--focus); outline-offset:2px; border-radius:4px; }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:-9999px; top:8px; z-index:200; }
.skip:focus{ left:8px; }

.vig{ display:block; width:100%; height:100%; }
.v{ display:inline-block; flex:none; line-height:0; }

/* ---------------------------------------------------------------- chrome -- */
.masthead{ position:sticky; top:0; z-index:40; background:var(--glass);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.masthead .in{ max-width:var(--maxw); margin:0 auto; padding:.5rem 1.1rem;
  display:flex; align-items:center; gap:.7rem; }
.brand{ display:flex; align-items:center; gap:.6rem; text-decoration:none;
  color:var(--head); font-weight:700; letter-spacing:-.01em; min-width:0; }
.brand .v{ width:38px; height:38px; }
.brand span{ font-size:1.12rem; line-height:1.1; white-space:nowrap; }
.brand small{ display:block; font-family:var(--sans); font-size:.6rem;
  letter-spacing:.16em; text-transform:uppercase; color:var(--acc); font-weight:700; margin-top:.15rem; }
nav.main{ margin-left:auto; display:flex; gap:.1rem; flex-wrap:nowrap; }
nav.main a{ font-family:var(--sans); font-size:.8rem; text-decoration:none; color:var(--muted);
  padding:.42rem .55rem; border-radius:8px; white-space:nowrap; }
nav.main a:hover{ background:var(--tint); color:var(--head); }
nav.main a.on{ background:var(--pri); color:var(--on-pri); }
.tools{ display:flex; align-items:center; gap:.35rem; margin-left:.35rem; }
.icon-btn{ width:40px; height:40px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--head); display:grid; place-items:center; cursor:pointer; flex:none; }
.icon-btn:hover{ border-color:var(--line-2); }
.icon-btn svg{ width:20px; height:20px; }
.help-pill{ font-family:var(--sans); font-size:.8rem; font-weight:700; text-decoration:none;
  color:var(--warn); background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  border-radius:999px; padding:.5rem .8rem; white-space:nowrap; display:inline-flex; align-items:center; gap:.4rem; }
.help-pill:hover{ filter:brightness(.98); }
.help-pill .dot{ width:8px; height:8px; border-radius:50%; background:var(--warn); }
.menu-btn{ display:none; }
.pal-ring .r1{ stroke:var(--pri); } .pal-ring .r2{ stroke:var(--sec); } .pal-ring .r3{ stroke:var(--focus); }
.pal-ring path{ fill:none; stroke-width:2.6; stroke-linecap:round; }

.stagebar{ background:var(--card); border-bottom:1px solid var(--line); }
.stagebar .in{ max-width:var(--maxw); margin:0 auto; padding:.35rem 1.1rem;
  display:flex; gap:.3rem; overflow-x:auto; scrollbar-width:thin; }
.stagebar a{ font-family:var(--sans); font-size:.76rem; text-decoration:none; color:var(--muted);
  padding:.36rem .62rem; border-radius:7px; white-space:nowrap; display:flex; align-items:center; gap:.4rem; }
.stagebar a b{ color:var(--acc); font-weight:700; }
.stagebar a:hover{ background:var(--tint); }
.stagebar a.on{ background:var(--sec); color:var(--on-sec); }
.stagebar a.on b{ color:var(--on-sec); opacity:.8; }

main{ max-width:var(--maxw); margin:0 auto; padding:1.6rem 1.1rem 4rem; display:block; }
main:focus{ outline:none; }

@media (max-width:1060px){
  nav.main{ display:none; }
  .menu-btn{ display:grid; }
  .tools{ margin-left:auto; }
}
@media (max-width:520px){
  .brand small{ display:none; }
  .brand span{ font-size:1.02rem; }
  .help-pill .lbl-long{ display:none; }
  .masthead .in{ gap:.45rem; padding:.45rem .7rem; }
  .icon-btn{ width:38px; height:38px; }
}

/* ------------------------------------------------------------- typography - */
h1,h2,h3,h4{ margin:0; line-height:1.15; letter-spacing:-.012em; color:var(--head); font-weight:650; }
h1{ font-size:clamp(1.75rem,3.6vw,2.55rem); }
h2{ font-size:clamp(1.3rem,2.3vw,1.62rem); }
h3{ font-size:1.12rem; }
h4{ font-size:1rem; }
p{ margin:.5rem 0; }
.lede{ font-style:italic; color:var(--muted); font-size:1.06rem; max-width:62ch; }
.eyebrow{ font-family:var(--sans); font-size:.68rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--acc); font-weight:700; }
.muted{ color:var(--muted); }
.small{ font-size:.93rem; }
.tiny{ font-family:var(--sans); font-size:.78rem; color:var(--faint); }
.serif-note{ font-style:italic; color:var(--muted); }
.rule{ height:1px; background:var(--line); border:0; margin:1.6rem 0; }
.prose{ max-width:68ch; }

/* ------------------------------------------------------------- components - */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:1rem 1.1rem; box-shadow:var(--shadow); min-width:0; }
.grid{ display:grid; gap:1rem; }
.g2{ grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr)); }
.g3{ grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); }
.row{ display:flex; gap:.7rem; align-items:center; flex-wrap:wrap; }
.row.end{ justify-content:flex-end; }
.spread{ display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
.stack{ display:flex; flex-direction:column; gap:1rem; }
.tight{ gap:.45rem; }

.btn{ font-family:var(--sans); font-size:.86rem; font-weight:700; cursor:pointer;
  border:1px solid var(--pri); background:var(--pri); color:var(--on-pri);
  padding:.55rem 1rem; border-radius:9px; text-decoration:none;
  display:inline-flex; align-items:center; gap:.4rem; min-height:40px; }
.btn:hover{ filter:brightness(1.1); }
.btn.ghost{ background:transparent; color:var(--head); border-color:var(--line-2); }
.btn.ghost:hover{ background:var(--tint); filter:none; }
.btn.quiet{ background:transparent; border-color:transparent; color:var(--muted); padding:.35rem .55rem; min-height:34px; }
.btn.quiet:hover{ background:var(--tint); color:var(--head); }
.btn.sec{ background:var(--sec); border-color:var(--sec); color:var(--on-sec); }
.btn.danger{ background:transparent; color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent); }
.btn.danger.solid{ background:var(--warn); color:var(--card); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.sm{ font-size:.78rem; padding:.36rem .66rem; min-height:34px; }

.field{ display:block; margin:.85rem 0; }
.field > label, .lbl{ display:block; font-family:var(--sans); font-size:.8rem; font-weight:700;
  letter-spacing:.02em; color:var(--muted); margin-bottom:.3rem; }
textarea,input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],select{
  width:100%; background:var(--card); border:1px solid var(--field); border-radius:9px;
  padding:.62rem .72rem; font-family:var(--serif); font-size:1rem; line-height:1.5; resize:vertical; color:var(--text); }
textarea{ min-height:5.2rem; }
textarea::placeholder,input::placeholder{ color:var(--faint); opacity:1; }
textarea:focus,input:focus,select:focus{ border-color:var(--focus); outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
input[type=range]{ width:100%; accent-color:var(--sec); }

.chip{ font-family:var(--sans); font-size:.8rem; padding:.34rem .68rem; border-radius:999px;
  border:1px solid var(--line-2); background:var(--card); color:var(--muted); cursor:pointer; min-height:34px; }
.chip.on,.chip[aria-pressed="true"]{ background:var(--pri); border-color:var(--pri); color:var(--on-pri); }
.chip.rose.on{ background:var(--warn); border-color:var(--warn); color:var(--card); }
.tag{ font-family:var(--sans); font-size:.74rem; padding:.16rem .5rem; border-radius:999px;
  background:var(--tint); color:var(--head); }
.badge{ font-family:var(--sans); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase;
  font-weight:700; padding:.2rem .46rem; border-radius:5px; white-space:nowrap; }
.badge.settled{ background:var(--ok-soft); color:var(--ok); }
.badge.working{ background:color-mix(in srgb, var(--acc) 14%, var(--card)); color:var(--acc); }
.badge.untouched{ background:var(--track); color:var(--muted); }

/* ---------------------------------------------------------- evidence ----- */
.ev{ display:inline-flex; flex-wrap:wrap; gap:.3rem; vertical-align:baseline; margin-left:.2rem; }
.g{ font-family:var(--sans); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
  padding:.12rem .45rem; border-radius:999px; white-space:nowrap; line-height:1.5; }
.g::before{ content:"●"; font-size:.55rem; margin-right:.3rem; vertical-align:1px; }
.g-strong{ background:var(--ok-soft); color:var(--ok); }
.g-mod{ background:var(--tint); color:var(--sec); }
.g-weak{ background:color-mix(in srgb, var(--acc) 13%, var(--card)); color:var(--acc); }
.g-no{ background:var(--warn-soft); color:var(--warn); }
.cite{ font-family:var(--sans); font-size:.72rem; color:var(--sec); background:transparent;
  border:1px solid color-mix(in srgb, var(--sec) 35%, transparent); border-radius:6px; padding:.06rem .42rem;
  cursor:pointer; line-height:1.55; }
.cite:hover{ background:var(--tint); }
.cn{ font-family:var(--sans); font-size:.72rem; color:var(--faint); font-style:italic; }
.pop{ position:fixed; z-index:120; max-width:min(420px,calc(100vw - 24px)); background:var(--card); color:var(--text);
  border:1px solid var(--line-2); border-radius:12px; padding:.9rem 1rem; box-shadow:0 20px 50px rgba(0,0,0,.22); }
.pop h4{ margin-bottom:.2rem; }
.pop .links{ display:flex; flex-wrap:wrap; gap:.4rem .9rem; margin-top:.5rem; font-family:var(--sans); font-size:.8rem; }
.learn-block{ margin:.2rem 0 1rem; }
.learn-block h3{ margin-bottom:.15rem; }
.learn-grid{ display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); }

/* --------------------------------------------------------------- home ----- */
.hero{ display:flex; gap:1.6rem; align-items:flex-start; justify-content:space-between; margin-bottom:1.6rem; }
.hero > div{ flex:1 1 auto; min-width:0; }
.hero > .v{ flex:none; width:132px; height:132px; margin-top:.25rem; }
@media (max-width:760px){
  .hero{ flex-direction:column-reverse; align-items:flex-start; }
  .hero > .v{ width:96px; height:96px; margin-top:0; }
}
.stagecard{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:1rem; text-decoration:none; color:inherit; align-items:start; }
.stagecard:hover{ border-color:var(--focus); }
.stagecard .v{ width:74px; height:74px; }
.stagecard h3{ margin-bottom:.15rem; }
.stagecard .num{ font-family:var(--sans); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--acc); font-weight:700; }
.bar{ height:6px; border-radius:3px; background:var(--track); overflow:hidden; margin-top:.6rem; }
.bar i{ display:block; height:100%; background:var(--sec); border-radius:3px; }
.quick{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr)); gap:.7rem; }
.quick a{ display:flex; align-items:center; gap:.6rem; text-decoration:none; color:inherit; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r); padding:.7rem .8rem; }
.quick a:hover{ border-color:var(--focus); }
.quick .v{ width:40px; height:40px; }
.quick b{ display:block; font-size:.98rem; color:var(--head); line-height:1.25; }
.quick .tiny{ display:block; line-height:1.35; margin-top:.15rem; }
.stat{ text-align:center; }
.stat b{ display:block; font-size:1.9rem; line-height:1.1; color:var(--head); }
.stat span{ font-family:var(--sans); font-size:.78rem; color:var(--muted); display:block; line-height:1.4; }

/* -------------------------------------------------------------- panels ---- */
.panelhead{ display:flex; align-items:center; gap:.8rem; margin:2.2rem 0 .9rem; }
.panelhead .n{ font-family:var(--sans); font-weight:700; font-size:.76rem; letter-spacing:.08em;
  background:var(--pri); color:var(--on-pri); padding:.28rem .52rem; border-radius:6px; }
.panelhead.teal .n{ background:var(--sec); color:var(--on-sec); }
.panelhead.green .n{ background:var(--ok); color:var(--card); }
.itemcard{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:.9rem; }
.itemcard .v{ width:62px; height:62px; }
.itemcard .desc{ font-style:italic; color:var(--muted); font-size:.98rem; }
.itemcard .cue{ font-family:var(--sans); font-size:.82rem; color:var(--faint); margin-top:.3rem; }
.itemcard .writing{ margin-top:.6rem; }
.satgrid{ display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr)); }
.satcard{ text-align:center; }
.satcard .v{ width:66px; height:66px; margin:0 auto .5rem; }
.satcard h4{ color:var(--sec); }
.satcard p{ font-style:italic; color:var(--muted); font-size:.94rem; }
.satcard summary{ cursor:pointer; font-family:var(--sans); font-size:.8rem; color:var(--sec); }
.tintbox{ background:var(--tint); border-color:transparent; }
.stripline{ display:flex; gap:.9rem; flex-wrap:wrap; justify-content:center; padding:.4rem 0; }
.stripline figure{ margin:0; text-align:center; width:84px; }
.stripline .v{ width:56px; height:56px; margin:0 auto; }
.stripline figcaption{ font-family:var(--sans); font-size:.76rem; color:var(--muted); margin-top:.25rem; }
.steplist{ display:grid; gap:.7rem; }
.steprow{ display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:.85rem; align-items:center;
  text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:.75rem .85rem; }
.steprow:hover{ border-color:var(--focus); }
.steprow .n{ width:28px; height:28px; border-radius:50%; background:var(--ok); color:var(--card);
  font-family:var(--sans); font-size:.78rem; font-weight:700; display:grid; place-items:center; }
.steprow .v{ width:48px; height:48px; }
.steprow .q{ font-style:italic; color:var(--muted); font-size:.95rem; }
.steprow b{ color:var(--head); }
@media (max-width:560px){
  .steprow{ grid-template-columns:auto minmax(0,1fr); }
  .steprow .v{ display:none; }
  .steprow .badge{ grid-column:2; justify-self:start; }
}

/* --------------------------------------------------------------- step ----- */
.stephead{ flex-wrap:nowrap; }
@media (max-width:560px){ .stephead{ flex-direction:column; gap:.5rem !important; } .stephead > .v{ width:64px !important; height:64px !important; } }
.stepwrap{ display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:1.6rem; align-items:start; }
@media (max-width:900px){ .stepwrap{ grid-template-columns:1fr; } }
.sidecard{ position:sticky; top:92px; }
.prompt{ border-left:3px solid var(--tint); padding-left:.9rem; margin:1.2rem 0; }
.prompt .q{ font-family:var(--sans); font-size:.84rem; font-weight:700; color:var(--muted); margin-bottom:.35rem; }
.saved{ font-family:var(--sans); font-size:.74rem; color:var(--ok); opacity:0; transition:opacity .3s; }
.saved.show{ opacity:1; }
.why{ border-radius:10px; background:var(--card-2); border:1px solid var(--line); padding:.6rem .8rem; font-size:.95rem; margin:.8rem 0; }
.care{ border-radius:var(--r); border:1px solid color-mix(in srgb, var(--acc) 40%, var(--line)); background:color-mix(in srgb, var(--acc) 7%, var(--card));
  padding:1rem 1.1rem; margin:1rem 0; }
.care h3{ color:var(--acc); }

/* ------------------------------------------------------------- journal ---- */
.entry{ border-left:3px solid var(--tint); padding:.2rem 0 .2rem .9rem; }
.entry + .entry{ margin-top:1.2rem; }
.entry .meta{ font-family:var(--sans); font-size:.78rem; color:var(--faint); display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
.entry .body{ white-space:pre-wrap; margin-top:.3rem; overflow-wrap:anywhere; }
.moodpip{ width:10px; height:10px; border-radius:50%; display:inline-block; }

/* ----------------------------------------------------------------- map ---- */
.mapgrid{ display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); }
.mapcol h4{ display:flex; align-items:center; gap:.5rem; }
.mapcol .v{ width:34px; height:34px; }
.node{ background:var(--card-2); border:1px solid var(--line); border-radius:8px; padding:.45rem .6rem; margin-top:.4rem;
  display:flex; gap:.5rem; align-items:flex-start; font-size:.95rem; }
.node .txt{ flex:1; overflow-wrap:anywhere; }
.node .x{ cursor:pointer; color:var(--faint); background:none; border:0; font-size:1.05rem; line-height:1; padding:.1rem .25rem; }
.node .x:hover{ color:var(--warn); }
.node.sel{ border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.mapsvg text{ font-family:var(--sans); }
.mapsvg .m-hub{ fill:var(--tint); stroke:var(--sec); }
.mapsvg .m-hubt{ fill:var(--sec); font-weight:700; }
.mapsvg .m-spoke{ stroke:var(--line-2); }
.mapsvg .m-dot{ fill:var(--sec); }
.mapsvg .m-lab{ fill:var(--sec); font-weight:700; }
.mapsvg .m-item{ fill:var(--muted); }
.mapsvg .m-link{ stroke:var(--focus); }

/* ------------------------------------------------------------- patterns --- */
.heat{ display:flex; gap:2px; }
.heat .wk{ display:flex; flex-direction:column; gap:2px; flex:1 1 0; }
.heat i{ display:block; height:9px; border-radius:2px; background:var(--track); }
.heat i[data-n="1"]{ background:color-mix(in srgb, var(--sec) 30%, var(--card)); }
.heat i[data-n="2"]{ background:color-mix(in srgb, var(--sec) 52%, var(--card)); }
.heat i[data-n="3"]{ background:color-mix(in srgb, var(--sec) 75%, var(--card)); }
.heat i[data-n="4"]{ background:var(--sec); }
.freq{ display:flex; flex-direction:column; gap:.4rem; }
.freq .r{ display:flex; align-items:center; gap:.6rem; font-size:.93rem; }
.freq .k{ width:118px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.freq .track{ flex:1 1 auto; height:10px; background:var(--track); border-radius:3px; overflow:hidden; }
.freq i{ display:block; height:100%; background:var(--sec); border-radius:3px; }
.freq.rose i{ background:var(--warn); } .freq.gold i{ background:var(--focus); } .freq.green i{ background:var(--ok); }
.freq .n{ width:30px; flex:none; text-align:right; }
.spark{ width:100%; height:auto; display:block; }
.spark .sp-line{ fill:none; stroke:var(--sec); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.spark .sp-dot{ fill:var(--sec); }
.spark .sp-grid{ stroke:var(--line); stroke-width:1; }

/* ------------------------------------------------------------- dialogue --- */
dialog.dlg{ border:0; border-radius:14px; padding:0; max-width:520px; width:92vw; background:var(--card); color:var(--text);
  box-shadow:0 24px 60px rgba(0,0,0,.3); }
dialog.dlg::backdrop{ background:var(--scrim); backdrop-filter:blur(2px); }
dialog.dlg .in{ padding:1.4rem 1.5rem; }
.toast{ position:fixed; left:50%; bottom:1.4rem; transform:translateX(-50%); background:var(--pri); color:var(--on-pri);
  padding:.65rem 1rem; border-radius:10px; font-family:var(--sans); font-size:.88rem; z-index:150; box-shadow:var(--shadow);
  max-width:calc(100vw - 2rem); }
.safety{ background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 25%, transparent); border-radius:var(--r);
  padding:.9rem 1rem; font-size:.97rem; color:var(--text); }
.safety strong{ color:var(--warn); }
.calm{ background:var(--tint); border-radius:var(--r); padding:.9rem 1rem; }

/* ----------------------------------------------------- settings (studio) -- */
.studio{ position:fixed; z-index:110; width:min(380px,calc(100vw - 20px)); max-height:calc(100vh - 90px); overflow:auto;
  background:var(--card); color:var(--text); border:1px solid var(--line-2); border-radius:16px; padding:1rem 1.05rem 1.1rem;
  box-shadow:0 24px 60px rgba(0,0,0,.25); }
.studio h3{ font-size:1.05rem; }
.studio .grp{ margin-top:.9rem; }
.studio .grp > .lbl{ margin-bottom:.4rem; }
.pals{ display:grid; grid-template-columns:1fr 1fr; gap:.45rem; }
.pal{ display:flex; gap:.55rem; align-items:center; text-align:left; border:1px solid var(--line); background:var(--card-2);
  border-radius:10px; padding:.5rem .55rem; cursor:pointer; min-height:52px; }
.pal[aria-checked="true"]{ border-color:var(--sec); box-shadow:0 0 0 2px color-mix(in srgb, var(--sec) 35%, transparent); }
.pal .dots{ display:flex; flex:none; }
.pal .dots i{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--card); margin-left:-4px; }
.pal .dots i:first-child{ margin-left:0; }
.pal b{ display:block; font-family:var(--sans); font-size:.82rem; color:var(--head); }
.pal small{ display:block; font-family:var(--sans); font-size:.7rem; color:var(--muted); line-height:1.3; }
.seg{ display:flex; border:1px solid var(--line-2); border-radius:10px; overflow:hidden; }
.seg button{ flex:1; font-family:var(--sans); font-size:.8rem; padding:.5rem .3rem; border:0; background:transparent; cursor:pointer; color:var(--muted); min-height:38px; }
.seg button + button{ border-left:1px solid var(--line-2); }
.seg button[aria-pressed="true"]{ background:var(--pri); color:var(--on-pri); font-weight:700; }
@media (max-width:480px){
  .studio{ left:10px!important; right:10px!important; bottom:10px; top:auto!important; width:auto; border-radius:18px; max-height:80vh; }
}

/* ------------------------------------------------------------ menu dlg ---- */
dialog.menu{ border:0; padding:0; margin:0 0 0 auto; height:100vh; max-height:100vh; width:min(340px,88vw); background:var(--card);
  color:var(--text); box-shadow:-20px 0 50px rgba(0,0,0,.25); }
dialog.menu::backdrop{ background:var(--scrim); }
dialog.menu .in{ padding:1rem 1rem 2rem; }
dialog.menu nav a{ display:block; font-family:var(--sans); font-size:1rem; padding:.7rem .6rem; border-radius:9px; text-decoration:none; color:var(--head); }
dialog.menu nav a.on{ background:var(--pri); color:var(--on-pri); }
dialog.menu .grp-t{ font-family:var(--sans); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--acc); font-weight:700; margin:1rem .6rem .3rem; }

/* ---------------------------------------------------------------- tools --- */
.toolgrid{ display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); }
.toolcard{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:.85rem; align-items:start; text-decoration:none; color:inherit; }
.toolcard:hover{ border-color:var(--focus); }
.toolcard .v{ width:56px; height:56px; }
.toolcard b{ color:var(--head); font-size:1.02rem; }
.orb-wrap{ display:grid; place-items:center; min-height:260px; position:relative; }
.orb{ width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 40% 35%, var(--card), var(--tint) 60%, color-mix(in srgb, var(--sec) 35%, var(--tint)));
  border:2px solid color-mix(in srgb, var(--sec) 40%, transparent); display:grid; place-items:center; text-align:center;
  font-family:var(--sans); color:var(--head); transition:transform 4s var(--ease); }
.orb .ph{ font-size:1.05rem; font-weight:700; }
.orb .ct{ font-size:.8rem; color:var(--muted); }
.ladder-list{ display:flex; flex-direction:column-reverse; gap:.5rem; }

.rung.done .sud{ background:var(--ok-soft); color:var(--ok); }
.pie-svg path{ stroke:var(--card); stroke-width:2; }
.pie-legend{ display:flex; flex-direction:column; gap:.35rem; }
.pie-legend .sw{ width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:.4rem; vertical-align:-1px; }
.thennow-card{ background:linear-gradient(135deg, var(--card), var(--tint)); border:1px solid var(--line-2); border-radius:18px; padding:1.4rem; }
.thennow-card .now-line{ font-size:1.35rem; color:var(--head); }
.pcl-q{ border-bottom:1px solid var(--line); padding:.8rem 0; }
.pcl-q{ border:0; margin:0; padding:.8rem 0; border-bottom:1px solid var(--line); min-width:0; }
.pcl-q legend{ padding:0; margin-bottom:.45rem; float:left; width:100%; }
.pcl-q .pcl-opts{ clear:both; }
.pcl-opts{ display:flex; flex-wrap:wrap; gap:.35rem; }
.pcl-opts label{ display:inline-flex; align-items:center; gap:.3rem; font-family:var(--sans); font-size:.8rem; border:1px solid var(--line-2);
  border-radius:999px; padding:.32rem .65rem; cursor:pointer; min-height:34px; background:var(--card); color:var(--muted); }
.pcl-opts input{ accent-color:var(--sec); }
.pcl-opts label:has(input:checked){ border-color:var(--sec); background:var(--tint); color:var(--head); font-weight:700; }
.result{ border-radius:var(--r); padding:1rem 1.1rem; background:var(--card-2); border:1px solid var(--line); }
.helpline{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.3rem 1rem; align-items:start; padding:.75rem 0; border-bottom:1px solid var(--line); }

.emerg{ display:flex; gap:1rem; align-items:center; background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent);

.tabs a.on{ background:var(--sec); border-color:var(--sec); color:var(--on-sec); }
.reflist .ref{ border-bottom:1px solid var(--line); padding:.8rem 0; }

table.tx th{ font-family:var(--sans); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line-2); }

.tablewrap{ overflow-x:auto; }
@media (max-width:640px){

}

.fig figcaption{ font-family:var(--sans); font-size:.82rem; color:var(--muted); margin-top:.5rem; }

.dg .t-body{ fill:var(--text); }
.dg .t-muted{ fill:var(--muted); }
.dg .t-acc{ fill:var(--acc); font-weight:700; }
.dg .t-warn{ fill:var(--warn); font-weight:700; }
.dg .t-ok{ fill:var(--ok); font-weight:700; }

.dg .ln-p1{ fill:none; stroke:var(--sec); stroke-width:2; stroke-linecap:round; opacity:.45; }

        { id: 'p1c', scene: 'childhood', title: 'What came before',
          desc: 'Earlier hurts, losses, and how safe life felt.',
          cue: 'Earlier hardship can make the alarm more sensitive. It does not make your reaction your fault.',
          prompt: 'What had already taught you that the world might not be safe?' },
        { id: 'p1d', scene: 'caregivers', title: 'What happened afterwards',
          desc: 'Who was there, who was not, whether you were believed.',
          cue: 'Support afterwards is one of the strongest influences on recovery.',
          prompt: 'Who helped afterwards? What did people say or do that made it harder?' },
        { id: 'p1e', scene: 'core_beliefs', title: 'What you concluded',
          desc: 'About yourself, other people and the world.',
          cue: 'Conclusions drawn in the worst moment often keep the alarm on long afterwards.',
          prompt: 'Finish these: "Since then I believe I am…", "…that people are…", "…that the world is…".' }
      ],

        text: 'These are inputs, not verdicts. None of them was chosen, and none of them says anything about your worth.' } },

    { n: 2, kind: 'construct', heading: 'How PTSD Keeps Itself Going', scene: 'hub_construct',
      lead: 'The working parts. Add your own words to each; they feed your map.',
      hub: { scene: 'alarm', label: 'A sense of current threat' },
      satellites: [
        { id: 'c1', key: 'intrusions', scene: 'fragments', title: 'Memories that feel like now',
          desc: 'Unwanted memories, flashbacks and nightmares. Often a sound, an image or a body feeling rather than a whole story.',
          prompt: 'When it comes back, what comes back? Name the kind of memory, not the details.' },
        { id: 'c2', key: 'reminders', scene: 'triggers', title: 'Reminders',
          desc: 'Places, smells, sounds, times of year, body feelings. Often things that were there just before or during the event.',
          prompt: 'What reliably brings it back?' },
        { id: 'c3', key: 'meanings', scene: 'core_beliefs', title: 'Meanings and beliefs',
          desc: '"I am not safe." "It was my fault." "I am broken." "No one can be trusted."',
          prompt: 'Write the belief in its rawest form.' },
        { id: 'c4', key: 'body', scene: 'vigilance', title: 'The body on guard',
          desc: 'Scanning for danger, startling easily, poor sleep, irritability, or feeling numb and far away.',
          prompt: 'Where does the alarm live in your body?' },
        { id: 'c5', key: 'behaviours', scene: 'avoid_door', title: 'Ways of coping that keep it going',
          desc: 'Avoiding reminders, pushing memories away, checking, going over it again and again, alcohol. Understandable, but they stop the memory updating.',
          prompt: 'What do you do to make it stop? What has it cost you?' }
      ],
      strip: { title: 'Feelings that often come with it', tone: 'rose', items: [
        { scene: 'fear', label: 'fear' }, { scene: 'shame', label: 'shame' },
        { scene: 'guilt', label: 'guilt' }, { scene: 'anger', label: 'anger' },
        { scene: 'numb', label: 'numbness' } ] },
      close: { scene: 'held', text: 'PTSD is a memory that has not yet been filed as past, kept alive by understandable ways of protecting yourself. It was learned, and what is learned can change.' } },

    { n: 3, kind: 'path', heading: 'The Noticing Path', scene: 'repeat_rebuild',
      lead: 'Eight movements for any moment the past breaks into the present. Use them as often as you need.',
      steps: [
        { id: 's1-1', scene: 'pause', title: 'Pause and Notice',
          question: 'What am I feeling, thinking and sensing right now?',
          cue: 'Name three of each before you do anything else.', tool: 'ground',
          prompts: ['Three feelings, named plainly', 'Three thoughts, as they actually arrived',
                    'Three body sensations, and where they sit'] },
        { id: 's1-2', scene: 'name_trigger', title: 'Name the Reminder',
          question: 'What just reminded me of then?',
          cue: 'Reminders are often small: a smell, a tone of voice, a time of day.',
          prompts: ['What happened just before the feeling arrived?',
                    'Which sense picked it up: sight, sound, smell, touch, taste or a body feeling?',
                    'How strong was it, from 0 (none) to 10 (the worst)?'] },
        { id: 's1-3', scene: 'then_now', title: 'Then, Not Now',
          question: 'What is different between then and now?',
          cue: 'Your memory may not know the difference yet. You can teach it, one reminder at a time.',
          why: { t: 'Spotting the differences between a reminder and the original danger is a core part of cognitive therapy for PTSD.', g: 'mod', r: 'INTRUSIONS CTPTSD' },
          tool: 'thennow',
          prompts: ['What it was like then, in a few words',
                    'What is different now: where I am, when it is, who is with me, what I can do',
                    'One sentence: "That was then. This is now, because…"'] },
        { id: 's1-4', scene: 'separate_fact', title: 'Separate Fact from Story',
          question: 'What is actually true, and what am I assuming?',
          cue: 'Two columns: what a camera would record, and what I added.',
          prompts: ['What a camera would have recorded', 'What I added to it',
                    'What a kind, reasonable friend might conclude'] },
        { id: 's1-5', scene: 'stuck_point', title: 'Find the Stuck Point',
          question: 'Which belief keeps this going?',
          cue: 'In cognitive processing therapy, a stuck point is a belief that keeps you stuck. It often starts with "I should have…" or "I can\'t…".',
          prompts: ['The belief, in one sentence',
                    'Which area it touches: safety, trust, power and control, self-worth, or closeness',
                    'What it has protected me from', 'What it would take for me to loosen it'] },
        { id: 's1-6', scene: 'reframe', title: 'Reframe with Compassion',
          question: 'What would a wiser, kinder view say?',
          cue: 'Speak to yourself as you would to someone you love.',
          prompts: ['What I would say to a friend in my place', 'A truer sentence to hold instead',
                    'What compassion does not ask me to pretend'] },
        { id: 's1-7', scene: 'grounded_action', title: 'Choose a Grounded Action',
          question: 'What small action supports safety or peace right now?',
          cue: 'Small and repeatable beats large and rare.',
          prompts: ['One action I can take in the next hour',
                    'What makes it more likely I will actually do it', 'How I will know it helped'] },
        { id: 's1-8', scene: 'repeat_rebuild', title: 'Repeat and Rebuild',
          question: 'How does new learning become a new pathway?',
          cue: 'Frequency, not intensity, is what retrains the alarm.',
          prompts: ['Where this pattern still repeats',
                    'The cue that will remind me to use this path again',
                    'What has already shifted, however slightly'] }
      ],
      toward: { title: 'Toward the Present', items: [
        { scene: 'clarity', label: 'clarity' }, { scene: 'self_trust', label: 'self-trust' },
        { scene: 'boundaries', label: 'boundaries' }, { scene: 'healing', label: 'healing' },
        { scene: 'direction', label: 'direction' } ] } }
  ],
  key: 'What happened explains these reactions. It does not define who you are or what you can become.',
  next: 'Steadying the present'
},

{
  id: 2, key: 'steady', tone: 'teal',
  short: 'Steadying',
  title: 'Steadying the Present',
  full: 'Steadying the Present: Safety, Body and Support',
  subtitle: 'Building steadier ground to stand on, before and alongside deeper work.',
  scene: 'grounding',
  intro: 'Recovery goes better from steadier ground. This stage is about safety, sleep, the body and people. It is not a test you must pass before treatment: most people, including those with long histories of trauma, can start trauma-focused therapy without a long preparation phase. Use these skills alongside it.',
  learn: [
    { h: 'Safety first',
      p: 'If you are still in danger, for example living with someone who hurts you, safety comes before anything else in this app. The Help page lists services that can help you plan.',
      g: '', r: '' },
    { h: 'You do not have to be "stable" first',
      p: 'A review of the evidence found no support for the idea that people with complex trauma must complete a long stabilisation phase before trauma-focused therapy. Steadying skills are worth learning, but they are not a gate.',
      g: 'mod', r: 'STABILISE' },
    { h: 'Skills that steady you',
      p: 'Grounding (using your senses to come back to the present), slow breathing and a predictable routine are widely used to settle a nervous system on high alert. They are sensible tools, but on their own they have not been tested as treatments for PTSD.',
      g: 'weak', r: '' },
    { h: 'Sleep and nightmares',
      p: 'A sleep-focused form of cognitive behavioural therapy (CBT, a practical talking therapy that works on thoughts and habits) improved insomnia a lot, and PTSD symptoms moderately, in trials. Imagery rehearsal, which means rewriting a recurring nightmare and rehearsing the new version while awake, reduced nightmares in many studies.',
      g: 'mod', r: 'CBTI_PTSD IRT AASM' },
    { h: 'Moving the body',
      p: 'In 16 trials with 663 people, exercise programmes reduced PTSD symptoms by a moderate amount, across different kinds of exercise.',
      g: 'mod', r: 'EXERCISE EXRCT' },
    { h: 'Alcohol, other drugs and sedatives',
      p: 'Many people with PTSD drink to switch off. It helps briefly, then worsens sleep, mood and the alarm. Sedatives called benzodiazepines (such as diazepam) are not recommended for PTSD: they did not help and were linked with worse outcomes.',
      g: 'no', r: 'ALCOHOL BENZO' }
  ],
  panels: [
    { n: 4, kind: 'inputs', heading: 'What Steadies You', scene: 'steadiness',
      lead: 'The ground you are standing on now.',
      items: [
        { id: 'p4a', scene: 'safe_home', title: 'Safety right now',
          desc: 'Physical safety at home, at work and online.',
          cue: 'If you are not safe, the Help page lists who can help you plan.',
          prompt: 'What makes you safer, and what would make you safer still?' },
        { id: 'p4b', scene: 'trusted_support', title: 'Your people',
          desc: 'Someone who listens without judging.',
          cue: 'Lack of support after trauma is one of the strongest predictors of PTSD continuing.',
          prompt: 'Who could you tell one true thing to this week?' },
        { id: 'p4c', scene: 'restore_basics', title: 'The body\'s basics',
          desc: 'Sleep, food, movement, alcohol, caffeine.',
          cue: 'Change one basic at a time.',
          prompt: 'Which one basic, if it were steadier, would help most?' },
        { id: 'p4d', scene: 'healing_practice', title: 'What already helps',
          desc: 'Even a little, even sometimes.',
          cue: 'You have already been coping. Start from what works.',
          prompt: 'What has helped on hard days, even slightly?' },
        { id: 'p4e', scene: 'window', title: 'Your window',
          desc: 'The zone where feelings are strong but manageable.',
          cue: 'Above it: panic, rage, racing. Below it: numb, foggy, far away. This "window of tolerance" is a clinical idea rather than a tested treatment, but many people find it useful.',
          g: 'weak', r: '',
          prompt: 'What are your early signs of too much? Of too little?' }
      ],
      note: { scene: 'stability',
        text: 'Steadiness is not the absence of storms. It is knowing what helps when one arrives.' } },

    { n: 5, kind: 'construct', heading: 'Your Steadying Toolkit', scene: 'hub_stewarded',
      lead: 'Five tools to practise while calm, so they are there when it is hard.',
      hub: { scene: 'grounding', label: 'Steady ground' },
      satellites: [
        { id: 'k1', key: 'ground', scene: 'five_senses', title: 'Grounding',
          desc: 'Five things you can see, four you can feel, three you can hear, two you can smell, one you can taste.',
          prompt: 'Which senses bring you back fastest?' },
        { id: 'k2', key: 'breathe', scene: 'breath', title: 'Slow breathing',
          desc: 'Breathing out a little longer than in, for a few minutes.',
          prompt: 'When could you practise for two minutes each day?' },
        { id: 'k3', key: 'sleep', scene: 'rest', title: 'Steadier nights',
          desc: 'The same wake-up time every day, bed for sleep, out of bed if awake and wound up.',
          prompt: 'What is one change to your nights you could try this week?' },
        { id: 'k4', key: 'move', scene: 'move_body', title: 'Moving the body',
          desc: 'Walking, swimming, strength work, yoga: whatever you will actually do.',
          prompt: 'What movement could you do three times this week?' },
        { id: 'k5', key: 'connect', scene: 'one_call', title: 'One safe person',
          desc: 'Regular contact with someone safe.',
          prompt: 'Who, and how: a text, a walk, a call?' }
      ],
      strip: { title: 'Signs you are outside your window', tone: 'rose', items: [
        { scene: 'pause_spiral', label: 'racing' }, { scene: 'fear', label: 'panic' },
        { scene: 'anger', label: 'rage' }, { scene: 'numb', label: 'numb' },
        { scene: 'confusion', label: 'far away' } ] },
      close: { scene: 'held', text: 'Practise these on calm days. A skill learned on a good day is there on a hard one.' } },

    { n: 6, kind: 'path', heading: 'The Steadying Path', scene: 'safe_rhythm',
      lead: 'Eight steps toward steadier ground. Return to them whenever you need to.',
      steps: [
        { id: 's2-1', scene: 'safety_plan', title: 'Check Your Safety',
          question: 'Am I safe right now, and who could I call?',
          cue: 'If the answer is no, open Get help first.', tool: 'safety',
          prompts: ['Am I physically safe right now? If not, what is the first step?',
                    'Two people or services I could contact', 'Where I keep my safety plan'] },
        { id: 's2-2', scene: 'five_senses', title: 'Ground Through the Senses',
          question: 'What is here, now?',
          cue: 'Say it out loud if you can: five, four, three, two, one.', tool: 'ground',
          prompts: ['Five things I can see', 'Four things I can feel against my body',
                    'Three sounds, two smells, one taste'] },
        { id: 's2-3', scene: 'breath', title: 'Slow the Breath',
          question: 'Can I let the out-breath be a little longer?',
          cue: 'Two to five minutes. If slow breathing makes you more anxious, stop and ground with your eyes open instead.',
          tool: 'breathe',
          prompts: ['How I felt before, from 0 to 10', 'What I noticed while breathing',
                    'How I felt after, from 0 to 10'] },
        { id: 's2-4', scene: 'rest', title: 'Steady the Nights',
          question: 'What would make sleep a little more predictable?',
          cue: 'Keep the same wake-up time every day, even after a bad night.',
          why: { t: 'These habits come from cognitive behavioural therapy for insomnia, which helped both sleep and PTSD symptoms in trials.', g: 'mod', r: 'CBTI_PTSD' },
          prompts: ['My wake-up time, every day this week',
                    'What I will do if I am awake and wound up for a while',
                    'What I will cut back: caffeine after midday, alcohol, screens in bed'] },
        { id: 's2-5', scene: 'move_body', title: 'Move the Body',
          question: 'What movement could I actually do this week?',
          cue: 'Something is better than nothing. Build up slowly.',
          prompts: ['The activity, when, and for how long', 'What might get in the way',
                    'How I felt afterwards'] },
        { id: 's2-6', scene: 'one_call', title: 'Reach One Person',
          question: 'Who could hear one true thing from me?',
          cue: 'You decide how much to share. "I am having a hard time" is enough.',
          prompts: ['Who', 'What I will say', 'How it went'] },
        { id: 's2-7', scene: 'lighthouse', title: 'Build a Hard-Day Plan',
          question: 'What will I do when it gets very hard?',
          cue: 'A written plan helps when thinking is hardest.', tool: 'safety',
          why: { t: 'A written safety plan with follow-up was linked with about half the rate of suicidal behaviour in a large study of people leaving emergency departments.', g: 'mod', r: 'SAFETYPLAN' },
          prompts: ['My early warning signs', 'What I will do first',
                    'Who I will contact, in order'] },
        { id: 's2-8', scene: 'consistent_practice', title: 'Practise Until It Is Easy',
          question: 'Which tool will I practise every day?',
          cue: 'Practise while calm. Two minutes a day is enough.',
          prompts: ['My daily practice, and when', 'How I will remember',
                    'What I noticed after a week'] }
      ],
      toward: { title: 'What Steadiness Brings', items: [
        { scene: 'steadiness', label: 'steadiness' }, { scene: 'rest', label: 'rest' },
        { scene: 'connection', label: 'connection' }, { scene: 'self_trust', label: 'self-trust' },
        { scene: 'hope', label: 'hope' } ] } }
  ],
  key: 'A steadier body makes braver work possible.',
  next: 'Making sense of what happened'
},

{
  id: 3, key: 'meaning', tone: 'green',
  short: 'Making sense',
  title: 'Making Sense',
  full: 'Making Sense: Unsticking the Beliefs Trauma Left Behind',
  subtitle: 'Looking again, from safer ground, at the conclusions drawn in the worst moment.',
  scene: 'stuck_point',
  intro: 'Trauma leaves conclusions behind: about blame, safety, trust, power, worth and closeness. They were drawn under extreme threat, and hindsight has often coloured them since. This stage gives them a second hearing.',
  learn: [
    { h: 'Why meanings matter',
      p: 'Across 135 studies, negative beliefs about the event and about yourself were strongly linked with PTSD, especially beliefs about the self, such as "I am weak" or "I am damaged".',
      g: 'mod', r: 'APPRAISALS' },
    { h: 'Therapies that work on meaning',
      p: 'Cognitive processing therapy (CPT) and cognitive therapy for PTSD (CT-PTSD) help people examine and update these beliefs. Both are first-line treatments with strong evidence. In 11 trials of CPT with 1,130 people, the average person treated did better than 89% of people who were not.',
      g: 'strong', r: 'CPT CTPTSD PHOENIX' },
    { h: 'Hindsight',
      p: '"I should have known" is often hindsight: information you have now that you did not have then. CPT teaches people to notice it, because judging the person you were by what you know now is unfair.',
      g: '', r: '' },
    { h: 'Guilt and shame',
      p: 'Guilt says "I did something bad". Shame says "I am bad". Both are common after trauma, and both can change. Being kinder to yourself has been linked with fewer PTSD symptoms, although this has been studied less.',
      g: 'weak', r: 'SELFCOMP' }
  ],
  panels: [
    { n: 7, kind: 'inputs', heading: 'The Areas Trauma Touches', scene: 'name_compromised',
      lead: 'Five areas where beliefs often change after trauma.',
      items: [
        { id: 'p7a', scene: 'safe_home', title: 'Safety',
          desc: 'Beliefs about danger to yourself and the people you love.',
          cue: 'Real risk is worth respecting. Overestimated risk keeps you trapped.',
          prompt: 'What do you now believe about how safe you, and the people you love, are?' },
        { id: 'p7b', scene: 'trust', title: 'Trust',
          desc: 'In your own judgement, and in other people.',
          cue: 'Trust can be rebuilt in small, tested steps.',
          prompt: 'Whom did you stop trusting, including yourself?' },
        { id: 'p7c', scene: 'agency', title: 'Power and control',
          desc: 'How much say you have over what happens to you.',
          cue: 'Losing control in one moment does not mean having none now.',
          prompt: 'Where do you feel powerless now? Where do you have more say than you think?' },
        { id: 'p7d', scene: 'self_respect', title: 'Self-worth',
          desc: 'How you see yourself, and how you think others see you.',
          cue: 'Shame tends to speak in absolutes.',
          prompt: 'What has the event told you about your worth? Is that how you would judge someone else?' },
        { id: 'p7e', scene: 'honest_relationships', title: 'Closeness',
          desc: 'Letting people in, physically and emotionally.',
          cue: 'Closeness can return gradually and on your terms.',
          prompt: 'What has changed in how close you let people come?' }
      ],
      note: { scene: 'new_story',
        text: 'These five areas come from cognitive processing therapy, one of the best-tested treatments for PTSD.' } },

    { n: 8, kind: 'construct', heading: 'Stuck Points', scene: 'hub_construct',
      lead: 'Beliefs that keep the alarm on. Name yours in your own words.',
      hub: { scene: 'stuck_point', label: 'Stuck points' },
      satellites: [
        { id: 'm1', key: 'blame', scene: 'self_blame', title: 'Blame',

        { id: 'm3', key: 'shame', scene: 'shame', title: 'Shame',

      ],
      strip: { title: 'Thinking traps', tone: 'rose', items: [

        { scene: 'self_blame', label: 'blaming self' } ] },
      close: { scene: 'held', text: 'A belief formed in the worst moment of your life deserves a second hearing in a safer one.' } },

    { n: 9, kind: 'path', heading: 'The Meaning Path', scene: 'reframe',
      lead: 'Eight steps for one stuck point at a time.',
      steps: [
        { id: 's3-1', scene: 'stuck_point', title: 'Write the Stuck Point',

        { id: 's3-2', scene: 'hindsight', title: 'Check for Hindsight',

          prompts: ['What I knew at the time', 'What I only learned afterwards',

        { id: 's3-4', scene: 'pie', title: 'Share Out Responsibility',
          question: 'Who and what played a part?',
          cue: 'Use the responsibility pie: list everyone and everything involved before giving yourself a slice.',
          tool: 'pie',
          prompts: ['Everyone and everything that played a part',

          why: { t: 'Updating the worst moments of the memory with what you know now is a central step in cognitive therapy for PTSD.', g: 'strong', r: 'CTPTSD' },
          prompts: ['The worst moment, named in a few words',
                    'What I know now that changes its meaning', 'The update, in one sentence'] },
        { id: 's3-6', scene: 'self_compassion', title: 'Speak with Compassion',
          question: 'What would kindness say?',
          cue: 'Write as you would to a friend who went through the same thing.',
          prompts: ['A short letter to myself, then', 'What I needed to hear',

        { id: 's3-7', scene: 'reframe', title: 'Try a Balanced Belief',
          question: 'What is a truer, fairer belief?',
          cue: 'Not cheerful: accurate.',
          prompts: ['The balanced belief', 'How strongly I believe it, from 0 to 100%',
                    'How strongly I now believe the original stuck point'] },
        { id: 's3-8', scene: 'repeat_rebuild', title: 'Notice What Shifts',
          question: 'Where does the new belief show up?',
          cue: 'Beliefs change through use. Notice it, and write it down.',

      ],
      toward: { title: 'Toward Fairness', items: [

  ],
  key: 'Understanding why it happened is not the same as believing it was your fault.',

},

{
  id: 4, key: 'face', tone: 'gold',
  short: 'Facing',
  title: 'Facing, Safely',
  full: 'Facing, Safely: Reclaiming What Avoidance Took',
  subtitle: 'Gradually approaching what is safe now but still feels dangerous.',
  scene: 'approach',
  intro: 'Avoidance makes sense: reminders hurt. But each time you avoid, the alarm is confirmed and your world gets smaller. This stage approaches reminders that are safe now, in small planned steps, so the alarm can learn the truth about the present.',
  learn: [
    { h: 'Why approaching helps',
      p: 'Exposure, meaning approaching feared but safe memories and situations step by step, is part of the best-tested treatments for PTSD. Across 13 trials of prolonged exposure therapy with 675 people, the benefit was large.',
      g: 'strong', r: 'PE CUSACK' },
    { h: 'Will it make things worse?',
      p: 'Most people do not get worse. In a study of 76 women with long-standing PTSD, only a minority had a temporary rise in symptoms during exposure therapy, and they still improved as much as everyone else.',
      g: 'mod', r: 'EXACERBATE' },
    { h: 'Only what is safe now',
      p: 'Approach reminders, not real danger. A street that looks like the one where something happened is a reminder; a person who is still violent is a danger.',
      g: '', r: '' },
    { h: 'The memory itself',

function smooth(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}

    <circle cx="${pk[0].toFixed(1)}" cy="${pk[1].toFixed(1)}" r="5" class="fill-warn" stroke="var(--card)" stroke-width="2"/>

function explainer(fig, DATA, title) {

// ---------------------------------------------------------------- wiring ---
function bind(root, route) {
  const flash = key => {
    const el = root.querySelector(`[data-saved="${key}"]`);
    if (!el) return;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1200);
  };
  // One debounced writer per field, so moving quickly between fields never loses text.
  const writers = new Map();
  const writer = (key, fn) => {
    if (!writers.has(key)) writers.set(key, debounce(fn, 450));
    return writers.get(key);
  };
  root.addEventListener('input', e => {
    const ta = e.target;
    if (ta.matches('textarea[data-step]')) {
      const { step: id, index } = ta.dataset;
      writer(`${id}-${index}`, v => { store.saveStep(id, +index, v); flash(`${id}-${index}`); })(ta.value);
    } else if (ta.matches('textarea[data-item]')) {
      const id = ta.dataset.item;
      writer(id, v => { store.saveItem(id, v); flash(id); })(ta.value);
    }
  }, { signal: viewSignal() });
  root.querySelectorAll('textarea').forEach(autogrow);

  on(root, 'click', '[data-settle]', (e, b) => {
    const id = b.dataset.settle;
    const now = store.get().steps[id]?.status === 'settled' ? 'working' : 'settled';
    store.setStepStatus(id, now);
    toast(now === 'settled' ? 'Marked as settled. You can reopen it any time.' : 'Reopened.');
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  });
  on(root, 'click', '[data-practice]', (e, b) => {
    store.logPractice(b.dataset.practice);
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  });
}

return { TOOL_LINKS, bind, home, stage, statusOf, step };
})();

function pclResult(total, items) {
  const groups = PCL5_GROUPS.map(g => `<li>${esc(g.name)}: <strong>${g.items.reduce((a, k) => a + items[k], 0)}</strong> of ${g.items.length * 4}</li>`).join('');

// ---------------------------------------------------------------- wiring ---
function bind(root) {
  root.querySelectorAll('textarea').forEach(autogrow);
  bindCharts(root);
  root.querySelectorAll('input[type=range]').forEach(r => r.addEventListener('input', () => {
    const o = root.querySelector(`#${r.id}-o`) || root.querySelector(`[data-out="${r.name}"]`);
    if (o) o.textContent = r.value;
  }));
  const press = (sel, single) => on(root, 'click', sel, (e, b) => {
    if (single) root.querySelectorAll(single(b)).forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    else b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });

  // ---- check-in
  const cform = root.querySelector('#cform');
  if (cform) {
    press('[data-tool]');
    press('[data-seg]', b => `[data-seg="${b.dataset.seg}"]`);
    cform.addEventListener('submit', e => {
      e.preventDefault();
      const segv = k => { const b = root.querySelector(`[data-seg="${k}"][aria-pressed="true"]`); return b && b.dataset.v !== '' ? +b.dataset.v : null; };
      store.addCheckin({ distress: +root.querySelector('#c-dist').value, sleep: +root.querySelector('#c-sleep').value,
        nightmare: segv('nightmare'), intrusions: segv('intrusions'), avoid: segv('avoid'),
        tools: [...root.querySelectorAll('[data-tool][aria-pressed="true"]')].map(b => b.dataset.tool),
        note: root.querySelector('#c-note').value.trim() });
      store.markPractice('checkin');
      toast('Check-in saved.');
      refresh();
    });
  }
  on(root, 'click', '[data-del-checkin]', async (e, b) => {
    if (await confirmBox({ title: 'Delete this check-in?', body: 'It cannot be recovered.', ok: 'Delete', danger: true })) { store.removeCheckin(b.dataset.delCheckin); refresh(); }
  });

  // ---- journal
  press('[data-mood]', () => '[data-mood]');
  const save = root.querySelector('#jsave');
  if (save) save.addEventListener('click', () => {
    const text = root.querySelector('#jtext').value.trim();
    if (!text) { toast('Nothing to save yet.'); return; }
    const m = root.querySelector('[data-mood][aria-pressed="true"]');
    const tags = root.querySelector('#jtags').value.split(',').map(t => t.trim()).filter(Boolean);
    store.addJournal({ text, mood: m ? +m.dataset.mood : null, tags, stepId: save.dataset.step || null });
    store.markPractice('journal');
    toast('Entry saved.');
    location.hash = '#/journal';
    refresh();
  });
  const search = root.querySelector('#jsearch');
  if (search) search.addEventListener('input', debounce(() => {
    const v = search.value.trim();
    history.replaceState(null, '', `#/journal${v ? '?q=' + encodeURIComponent(v) : ''}`);
    refresh();
    setTimeout(() => { const el = document.querySelector('#jsearch'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);
  }, 350));
  on(root, 'click', '[data-del-entry]', async (e, b) => {
    if (await confirmBox({ title: 'Delete this entry?', body: 'It cannot be recovered.', ok: 'Delete', danger: true })) { store.removeJournal(b.dataset.delEntry); refresh(); }
  });

  // ---- record
  const rform = root.querySelector('#rform');
  if (rform) {
    press('[data-trap]');
    rform.addEventListener('submit', e => {
      e.preventDefault();
      const val = n => rform.querySelector(`[name="${n}"]`)?.value.trim() || '';
      const num = n => +rform.querySelector(`[name="${n}"]`).value;
      const payload = { situation: val('situation'), reminder: val('reminder'), body: val('body'), thenWas: val('thenWas'),
        nowIs: val('nowIs'), thought: val('thought'), evidenceFor: val('evidenceFor'), evidenceAgainst: val('evidenceAgainst'),
        reframe: val('reframe'), action: val('action'),
        traps: [...rform.querySelectorAll('[data-trap][aria-pressed="true"]')].map(b => b.dataset.trap),
        distressBefore: num('distressBefore'), distressAfter: num('distressAfter'),
        beliefBefore: num('beliefBefore'), beliefAfter: num('beliefAfter') };
      if (!payload.situation && !payload.reminder && !payload.thought) { toast('Add at least what happened, the reminder or the thought.'); return; }
      if (rform.dataset.id) { store.updateRecord(rform.dataset.id, payload); toast('Record updated.'); }
      else { store.addRecord(payload); toast('Record saved.'); }
      store.markPractice('record');
      location.hash = '#/record';
      refresh();
    });
  }
  on(root, 'click', '[data-del-record]', async (e, b) => {
    if (await confirmBox({ title: 'Delete this record?', body: 'It cannot be recovered.', ok: 'Delete', danger: true })) { store.removeRecord(b.dataset.delRecord); refresh(); }
  });

  // ---- PCL-5
  const pform = root.querySelector('#pform');
  if (pform) pform.addEventListener('submit', e => {
    e.preventDefault();
    const items = PCL5.map((q, i) => { const c = pform.querySelector(`input[name="q${i}"]:checked`); return c ? +c.value : null; });
    const missing = items.map((v, i) => v == null ? i + 1 : null).filter(Boolean);
    if (missing.length) {
      root.querySelector('#pmiss').textContent = `Please answer question${missing.length > 1 ? 's' : ''} ${missing.join(', ')}.`;
      pform.querySelector(`input[name="q${missing[0] - 1}"]`).focus();
      return;
    }
    const rec = store.addPCL(items);
    store.markPractice('pcl');
    pendingResult = { total: rec.total, items };
    refresh();
  });
  const out = root.querySelector('#presult');
  if (out && out.textContent.trim()) setTimeout(() => out.scrollIntoView({ block: 'start' }), 30);
  on(root, 'click', '[data-del-pcl]', async (e, b) => {
    if (await confirmBox({ title: 'Delete this result?', body: 'It cannot be recovered.', ok: 'Delete', danger: true })) { store.removePCL(b.dataset.delPcl); refresh(); }
  });
}

return { bind, checkin, journal, pcl, record };
})();

function ring(m) {

    const lines = items.slice(0, 3).map(n => n.text.length > 28 ? n.text.slice(0, 27) + '…' : n.text);
    const h = 40 + Math.max(1, lines.length) * 16 + (items.length > 3 ? 14 : 0);

  };

// ---------------------------------------------------------------- wiring ---
let linkFrom = null;
function bind(root) {
  bindCharts(root);
  root.querySelectorAll('form[data-add]').forEach(f => f.addEventListener('submit', e => {
    e.preventDefault();
    const t = f.querySelector('input').value.trim();
    if (!t) return;
    store.addMapNode(f.dataset.add, t);
    refresh();
    setTimeout(() => document.querySelector(`#add-${f.dataset.add}`)?.focus(), 0);
  }));
  on(root, 'click', '[data-del-node]', (e, b) => { const [k, id] = b.dataset.delNode.split(':'); store.removeMapNode(k, id); refresh(); });
  on(root, 'click', '[data-link-from]', (e, b) => {
    const id = b.dataset.linkFrom;
    if (!linkFrom) {
      linkFrom = id;
      root.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n.dataset.node === id));
      toast('Now choose ⇄ on the entry to connect it with.');

      linkFrom = null; root.querySelectorAll('.node.sel').forEach(n => n.classList.remove('sel'));
    } else { store.toggleLink(linkFrom, id); linkFrom = null; toast('Connected.'); refresh(); }
  });
  on(root, 'click', '[data-unlink]', (e, b) => { const [a, c] = b.dataset.unlink.split('|'); store.toggleLink(a, c); refresh(); });

  on(root, 'click', '[data-act]', async (e, b) => {
    const act = b.dataset.act;
    if (act === 'set-pass' || act === 'change-pass') {
      const p1 = await promptBox({ title: act === 'set-pass' ? 'Set a passphrase' : 'Choose a new passphrase', label: 'Passphrase (at least 8 characters)', type: 'password', ok: 'Next' });
      if (!p1) return;
      if (p1.length < 8) { toast('Please use at least 8 characters.'); return; }
      const p2 = await promptBox({ title: 'Type it again', label: 'Passphrase', type: 'password', ok: 'Lock' });
      if (p1 !== p2) { toast('Those did not match. Nothing changed.'); return; }
      await store.enableEncryption(p1); toast('Locked. You will need the passphrase next time.'); refresh();
    } else if (act === 'remove-pass') {
      if (await confirmBox({ title: 'Remove the lock?', body: 'Your writing will be stored without encryption in this browser.', ok: 'Remove lock', danger: true })) {
        await store.disableEncryption(); toast('Lock removed.'); refresh();
      }
    } else if (act === 'lock-now') { window.dispatchEvent(new CustomEvent('tn:lock')); }
    else if (act === 'export') {
      download(store.exportBlob(), `then-and-now-${store.today()}.json`); toast('Exported. Keep the file somewhere private.');
    } else if (act === 'erase') {
      if (await confirmBox({ title: 'Erase everything?', body: 'All your writing in this browser will be deleted. This cannot be undone.', ok: 'Erase', danger: true })) {
        await store.eraseAll(); toast('Erased.'); location.hash = '#/'; refresh();
      }
    }
  });
  on(root, 'change', '[data-act="import"]', async (e, inp) => {
    const file = inp.files && inp.files[0]; if (!file) return;
    if (!(await confirmBox({ title: 'Replace your data?', body: 'Importing replaces everything currently stored in this browser with the file\'s contents.', ok: 'Import', danger: true }))) { inp.value = ''; return; }
    const res = await store.importJSON(await file.text());
    toast(res.ok ? 'Imported.' : res.error); inp.value = ''; refresh();
  });
}

return { bind, data, map, patterns };
})();

      <h2 style="font-size:1.05rem;margin-top:1rem">3 · Then your share</h2>
      ${me ? row(me, p.slices.indexOf(me)) : `<button class="btn ghost sm" data-addme>Add my share</button>`}
      <p class="tiny" style="margin-top:.6rem">Total: <strong>${used}%</strong>${used > 100 ? ' (more than 100%: reduce some shares)' : ''}</p>
    </section>
    <section class="card"><h2 style="font-size:1.05rem">The whole picture</h2>
      ${bar || '<p class="tiny muted">Add shares to see them here.</p>'}
      ${segs.length ? `<div class="legend"><span><i class="lk-sq" style="background:var(--line-2)"></i>Everyone and everything else</span>
        <span><i class="lk-sq" style="background:var(--acc)"></i>My share</span></div>

      <div class="why" style="margin-top:1rem"><strong>Questions to ask.</strong> Did I intend harm? Could I really have known what

      <div class="row" style="margin-top:.8rem"><button class="btn" data-savepie>${p.id ? 'Save changes' : 'Save this pie'}</button>
        <button class="btn ghost" data-newpie>Start a new one</button></div>
      <p class="tiny" style="margin-top:.8rem">From cognitive processing therapy, which has strong evidence for PTSD. Shown as a bar so
        the shares are easy to compare. ${ev('strong', 'CPT')}</p>
    </section>
  </div>
  ${s.pies.length ? `<h2 style="margin:1.6rem 0 .5rem">Saved</h2><div class="card">${s.pies.map(x => {
    const mine = x.slices.find(y => y.me);
    return `<div class="spread" style="border-bottom:1px solid var(--line);padding:.45rem 0;flex-wrap:nowrap"><span class="small"><strong>${esc(x.event || 'Untitled')}</strong>
      <span class="tiny"> · ${fmtDate(x.at)}${mine ? ` · my share ${mine.pct}%` : ''}</span></span>
      <span class="row tight" style="flex-wrap:nowrap"><a class="btn quiet sm" href="#/tools/pie?id=${x.id}">Open</a>
      <button class="btn quiet sm" data-delpie="${x.id}" aria-label="Delete ${esc(x.event || 'untitled pie')}">×</button></span></div>`;
  }).join('')}</div>` : ''}`;
}

      <li><strong>Prolonged exposure</strong> involves recounting the memory aloud, in detail, with a therapist, and listening back between sessions. ${ev('strong', 'PE')}</li>
      <li><strong>Written exposure therapy</strong> involves writing about the trauma for set periods across five sessions with a therapist. ${ev('mod', 'WET')}</li>

      <label class="sr-only" for="mem-text">My impact statement</label>
      <textarea id="mem-text" data-mem="text" rows="10">${esc(m.text)}</textarea>

// ---------------------------------------------------------------- wiring ---
function bind(root, route) {
  root.querySelectorAll('textarea').forEach(autogrow);
  const flash = key => { const el = root.querySelector(`[data-saved="${key}"]`); if (el) { el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1200); } };
  const writers = new Map();
  const w = (key, fn) => { if (!writers.has(key)) writers.set(key, debounce(fn, 450)); return writers.get(key); };

  // grounding
  if (root.querySelector('#ground')) {
    groundStep(root);
    on(root, 'click', '[data-g]', (e, b) => {
      const box = root.querySelector('#ground');
      let i = +box.dataset.step, n = +box.dataset.n;
      const act = b.dataset.g;
      if (act === 'one') { n += 1; if (n >= SENSES[i][0]) { i += 1; n = 0; } }
      else if (act === 'skip') { i += 1; n = 0; }
      else if (act === 'back') { i = Math.max(0, i - 1); n = 0; }
      else if (act === 'again') { i = 0; n = 0; }
      else if (act === 'log') { store.markPractice('ground'); toast('Practice logged.'); return; }
      box.dataset.step = i; box.dataset.n = n; groundStep(root);
      root.querySelector('#g-body button.btn:not(.ghost):not(.quiet)')?.focus();
    });
  }
  // breathing
  if (root.querySelector('#orb')) {
    let mins = 2;
    on(root, 'click', '[data-len]', (e, b) => { mins = +b.dataset.len; root.querySelectorAll('[data-len]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    root.querySelector('#b-start').addEventListener('click', () => {
      root.querySelector('#b-start').disabled = true; root.querySelector('#b-stop').disabled = false;
      breathTimer = -1; runBreath(root, mins);
    });
    root.querySelector('#b-stop').addEventListener('click', () => stopBreath(root, false));
  }
  // card
  root.querySelectorAll('[data-card]').forEach(ta => ta.addEventListener('input', () => {
    w('card', () => {
      const v = {}; root.querySelectorAll('[data-card]').forEach(x => { v[x.dataset.card] = x.value; });
      store.patch('card', { ...v, updatedAt: Date.now() });
      const d = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      root.querySelector('#card-view').innerHTML = cardHTML(store.get().card, d);
      root.querySelector('#card-saved').textContent = 'Saved.';
    })();
  }));
  root.querySelector('#card-full')?.addEventListener('click', () => {
    const d = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const dlg = h(`<dialog class="dlg" style="max-width:760px;width:96vw" aria-label="Then-and-now card"><div class="in thennow-card" style="border:0;border-radius:0;font-size:1.15rem">
      ${cardHTML(store.get().card, d)}<form method="dialog" class="row end" style="margin-top:1rem"><button class="btn">Close</button></form></div></dialog>`);
    document.body.append(dlg); dlg.addEventListener('close', () => dlg.remove()); dlg.showModal();
    store.markPractice('thennow');
  });
  // safety plan
  root.querySelectorAll('[data-safety]').forEach(ta => ta.addEventListener('input', () =>
    w(ta.dataset.safety, v => { store.saveSafety(ta.dataset.safety, v); flash('sp-' + ta.dataset.safety); })(ta.value)));
  // ladder
  const rf = root.querySelector('#rung-form');
  if (rf) {
    const sl = root.querySelector('#rung-suds');
    sl.addEventListener('input', () => { root.querySelector('#rung-o').textContent = sl.value; });
    rf.addEventListener('submit', e => {
      e.preventDefault();
      const t = root.querySelector('#rung-text').value.trim();
      if (!t) { toast('Describe the step first.'); return; }
      store.addRung(t, sl.value); refresh();
    });
  }
  root.querySelectorAll('form[data-try]').forEach(f => {
    f.querySelectorAll('input[type=range]').forEach(r => r.addEventListener('input', () => { r.closest('label').querySelector('output').textContent = r.value; }));
    f.addEventListener('submit', e => {
      e.preventDefault();
      const g = k => +f.querySelector(`[name="${k}"]`).value;
      store.addTry(f.dataset.try, { before: g('before'), peak: g('peak'), after: g('after') });
      store.markPractice('ladder'); toast('Try logged. Well done for facing it.'); refresh();
    });
  });
  on(root, 'click', '[data-done]', (e, b) => { const r = store.get().ladder.find(x => x.id === b.dataset.done); store.updateRung(b.dataset.done, { done: !r.done }); refresh(); });
  on(root, 'click', '[data-del-rung]', async (e, b) => {
    if (await confirmBox({ title: 'Delete this step?', body: 'Its tries will be deleted too.', ok: 'Delete', danger: true })) { store.removeRung(b.dataset.delRung); refresh(); }
  });
  // pie
  if (root.querySelector('#pie-event')) {
    const P = draftPie;
    root.querySelector('#pie-event').addEventListener('input', e => { P.event = e.target.value; });
    root.querySelector('#pie-add').addEventListener('submit', e => {
      e.preventDefault(); const v = root.querySelector('#pie-new').value.trim(); if (!v) return;
      const me = P.slices.findIndex(x => x.me);
      const item = { label: v, pct: 0 };
      if (me >= 0) P.slices.splice(me, 0, item); else P.slices.push(item);
      refresh(); setTimeout(() => document.querySelector('#pie-new')?.focus(), 0);
    });
    root.querySelectorAll('[data-sl]').forEach(inp => inp.addEventListener('change', () => {
      const x = P.slices[+inp.dataset.sl];
      if (inp.dataset.k === 'pct') x.pct = Math.max(0, Math.min(100, Math.round(+inp.value || 0))); else x.label = inp.value;
      refresh();
    }));
    on(root, 'click', '[data-rm]', (e, b) => { P.slices.splice(+b.dataset.rm, 1); refresh(); });
    on(root, 'click', '[data-addme]', () => { P.slices.push({ label: 'Me', pct: 0, me: true }); refresh(); });
    on(root, 'click', '[data-savepie]', () => {
      if (!P.slices.length) { toast('Add at least one share first.'); return; }
      if (!P.id) P.id = store.uid();
      store.savePie(JSON.parse(JSON.stringify(P))); toast('Saved.'); store.markPractice('pie');
      history.replaceState(null, '', '#/tools/pie?id=' + P.id); refresh();
    });
    on(root, 'click', '[data-newpie]', () => { draftPie = { id: null, event: '', slices: [] }; history.replaceState(null, '', '#/tools/pie'); refresh(); });
    on(root, 'click', '[data-delpie]', async (e, b) => {
      if (await confirmBox({ title: 'Delete this pie?', body: 'It cannot be recovered.', ok: 'Delete', danger: true })) {
        store.removePie(b.dataset.delpie); if (P.id === b.dataset.delpie) draftPie = null; refresh();
      }
    });
  }
  // opt-in consent
  const cb = root.querySelector('#consent-box');
  if (cb) cb.addEventListener('change', () => { root.querySelector('[data-consent]').disabled = !cb.checked; });
  on(root, 'click', '[data-consent]', (e, b) => { store.patch(b.dataset.consent, { consent: true }); refresh(); });
  on(root, 'click', '[data-unconsent]', (e, b) => { store.patch(b.dataset.unconsent, { consent: false }); refresh(); });
  // nightmare
  root.querySelectorAll('[data-nm]').forEach(inp => inp.addEventListener('input', () =>
    w('nm-' + inp.dataset.nm, v => { store.patch('nightmare', { [inp.dataset.nm]: v }); flash('nm'); })(inp.value)));
  const viv = root.querySelector('#nm-viv');
  if (viv) viv.addEventListener('input', () => { root.querySelector('#nm-viv-o').textContent = viv.value; });
  on(root, 'click', '[data-rehearse]', () => {
    const n = store.get().nightmare;
    store.patch('nightmare', { rehearsals: [...n.rehearsals, { at: Date.now(), vivid: +viv.value }] });
    store.markPractice('nightmare'); toast('Rehearsal logged.'); refresh();
  });
  // memory
  root.querySelectorAll('[data-mem]').forEach(inp => inp.addEventListener('input', () =>
    w('mem-' + inp.dataset.mem, v => { store.patch('memory', { [inp.dataset.mem]: v }); flash('mem'); })(inp.value)));
}

function unbind() { if (breathTimer) { clearTimeout(breathTimer); breathTimer = null; } }

return { TOOLS, bind, breathe, ground, index, ladder, memory, nightmare, pie, safety, thennow, unbind };
})();

function bind(root, route) {

  const s = new URLSearchParams(route.query || '').get('s');
  if (s != null) { const el = root.querySelector(`#sec-${s}`) || root.querySelector(`#${CSS.escape(s)}`); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 30); }

  if (focus) { const el = root.querySelector(`#ref-${focus}`); if (el) setTimeout(() => el.scrollIntoView({ block: 'center' }), 30); }
}

return { about, bind, evidence, grades, guide, help, learnIndex };

function parse() {

  T.unbind();
  const { path, query } = parse();
  let out = null, m = null;
  for (const [re, fn] of ROUTES) { m = path.match(re); if (m) { out = fn(m, query); break; } }
  if (!out) out = ['missing', 'Not found', `<div class="card" style="max-width:60ch"><h1>Page not found</h1>
    <p class="muted">That link does not lead anywhere in this app. <a href="#/">Back to the start</a></p></div>`, null];
  const [name, title, html, bind] = out;
  drawChrome(path);
  newView();
  app.innerHTML = html;
  D.title = `${title ? title + ' · ' : ''}Then and Now`;
  if (bind) bind(app, { name, path, query, arg: m && m[1] });
  window.dispatchEvent(new CustomEvent('tn:rendered', { detail: { name } }));
  if (lastPath !== path) {
    if (!/[?&]s=/.test(query) && !/[?&]ref=/.test(query)) window.scrollTo(0, 0);
    if (lastPath !== null) app.focus({ preventScroll: true });
    lastPath = path;
  }
}
